<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversor PDF → DWG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Conversor PDF → DWG</h1>
      <p class="sub">Desenhos escaneados viram DWG (AutoCAD 2018) com linhas, símbolos, textos e marcações de as-built em camadas separadas.</p>
    </div>
    <div id="user" hidden><span id="userEmail"></span> <button id="logout">Sair</button></div>
  </header>

  <!-- Login -->
  <section id="auth" class="card" hidden>
    <h2>Entrar</h2>
    <form id="authForm">
      <label>E-mail <input id="email" type="email" autocomplete="email" required></label>
      <label>Senha <input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
      <div class="actions">
        <button class="primary" type="submit" data-mode="login">Entrar</button>
        <button type="submit" data-mode="signup">Criar conta</button>
      </div>
    </form>
    <p id="authMsg" class="msg"></p>
  </section>

  <!-- App -->
  <section id="app" hidden>
    <div id="worker" class="worker"></div>
    <div id="drop" tabindex="0" role="button">
      <strong>Solte os PDFs aqui</strong>
      <span>ou clique para escolher — até 50 MB por arquivo, vários de uma vez</span>
      <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
    </div>
    <p id="msg" class="msg"></p>
    <div id="jobs"></div>
  </section>

  <p id="fatal" class="msg err" hidden></p>
</main>
<div id="zoom"><img alt=""></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script src="app.js"></script>
</body>
</html>
